<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tập vòng lặp (Phần nâng cao)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .exercise-box {
            background: #ffffff;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #e67e22;
        }
        h2 {
            margin-top: 0;
            color: #d35400;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #e67e22;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
        }
        button:hover {
            background-color: #d35400;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background-color: #1e272e;
            color: #00d2d3;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            overflow-x: auto;
            line-height: 1.4;
        }
        .triangle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .triangle-box {
            background: #2f3640;
            color: #f5f6fa;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            font-size: 1.1rem;
        }
        .triangle-box h3 {
            margin-top: 0;
            font-size: 0.9rem;
            color: #fbc531;
            border-bottom: 1px solid #718093;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Luyện Tập Vòng Lặp (Mức độ 2)</h1>

    <div class="exercise-box">
        <h2>Bài 1: In dãy Fibonacci</h2>
        <div class="input-group">
            <label>Nhập số lượng phần tử cần in (n):</label>
            <input type="number" id="b1_n" value="10" min="1">
        </div>
        <button onclick="bai1()">In dãy số</button>
        <div class="result" id="res_b1">Kết quả dãy Fibonacci...</div>
    </div>

    <div class="exercise-box">
        <h2>Bài 2: Tính giai thừa của một số nguyên dương</h2>
        <div class="input-group">
            <label>Nhập số nguyên dương (n):</label>
            <input type="number" id="b2_n" value="5" min="0">
        </div>
        <button onclick="bai2()">Tính giai thừa</button>
        <div class="result" id="res_b2">Kết quả giai thừa...</div>
    </div>

    <div class="exercise-box">
        <h2>Bài 3: In tam giác vuông (4 vị trí góc vuông khác nhau)</h2>
        <div class="input-group">
            <label>Nhập chiều cao tam giác (số dòng):</label>
            <input type="number" id="b3_h" value="5" min="1" max="20">
        </div>
        <button onclick="bai3()">In các hình tam giác</button>
        
        <div class="triangle-grid">
            <div class="triangle-box">
                <h3>Góc vuông dưới - trái</h3>
                <div id="tg_1"></div>
            </div>
            <div class="triangle-box">
                <h3>Góc vuông trên - trái</h3>
                <div id="tg_2"></div>
            </div>
            <div class="triangle-box">
                <h3>Góc vuông dưới - phải</h3>
                <div id="tg_3"></div>
            </div>
            <div class="triangle-box">
                <h3>Góc vuông trên - phải</h3>
                <div id="tg_4"></div>
            </div>
        </div>
    </div>
</div>

<script src="./Session12 baitap4.js"></script>
</body>
</html>
