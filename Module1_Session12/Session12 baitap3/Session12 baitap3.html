<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiển thị 20 số nguyên tố đầu tiên</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.4rem;
        }
        p {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
            min-height: 50px;
        }
        .prime-number {
            display: inline-block;
            background-color: #e8f8f5;
            color: #117a65;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.05rem;
            border: 1px solid #a3e4d7;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ứng dụng Tìm Số Nguyên Tố</h2>
    <p>Luyện tập vòng lặp và cấu trúc điều kiện để tìm 20 số nguyên tố đầu tiên.</p>
    
    <button onclick="hienThiSoNguyenTo()">Hiển thị kết quả</button>
    
    <div class="result-box" id="result">
        Nhấn nút phía trên để bắt đầu tìm kiếm...
    </div>
</div>

<script src="./Session12 baitap3.js"></script>
</body>
</html>
