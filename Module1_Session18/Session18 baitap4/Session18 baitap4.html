<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bàn phím ảo</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
        }

        /* Container của bàn phím */
        .keyboard-container {
            background-color: #ededed;
            padding: 20px;
            border-radius: 4px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Ô nhập liệu */
        .text-input {
            width: 100%;
            height: 50px;
            padding: 10px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            outline: none;
            color: #333;
        }

        .text-input::placeholder {
            color: #999;
        }

        /* Lưới chứa các nút bấm */
        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 10 cột đều nhau */
            gap: 10px;
        }

        /* Style chung cho các phím */
        .key {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            height: 55px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.1s ease;
            user-select: none;
        }

        .key:active {
            opacity: 0.9;
        }

        /* Phím Xóa màu đỏ */
        .key.delete {
            background-color: #dc3545;
            grid-column: span 1;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="keyboard-container">
        <input type="text" id="output" class="text-input" placeholder="Nhập ở đây..." readonly>

        <div class="keyboard-grid">
            <button class="key">A</button>
            <button class="key">B</button>
            <button class="key">C</button>
            <button class="key">D</button>
            <button class="key">E</button>
            <button class="key">F</button>
            <button class="key">G</button>
            <button class="key">H</button>
            <button class="key">I</button>
            <button class="key">J</button>

            <button class="key">K</button>
            <button class="key">L</button>
            <button class="key">M</button>
            <button class="key">N</button>
            <button class="key">O</button>
            <button class="key">P</button>
            <button class="key">Q</button>
            <button class="key">R</button>
            <button class="key">S</button>
            <button class="key">T</button>

            <button class="key">U</button>
            <button class="key">V</button>
            <button class="key">W</button>
            <button class="key">X</button>
            <button class="key">Y</button>
            <button class="key">Z</button>
            <button class="key delete">Xóa</button>
        </div>
    </div>

    <script src="./Session18 baitap4.js"></script>
</body>
</html>
