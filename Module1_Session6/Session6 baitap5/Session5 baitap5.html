<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Welcome to My Website</title>
    <link rel="stylesheet" href="./Session5 baitap5.css">
</head>
<body>

    <!-- 1. Thanh điều hướng (Navbar) -->
    <header class="navbar">
        <div class="navbar-container">
            <div class="logo">MyLogo</div>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>

    <!-- 2. Phần Banner chính (Hero Section) -->
    <section class="hero-section">
        <div class="hero-content">
            <h1>Welcome to My Website</h1>
            <p>We provide the best solutions for your business.</p>
            <button class="btn-get-started">Get Started</button>
        </div>
    </section>

    <!-- 3. Phần các tính năng (Features Section) -->
    <section class="features-section">
        <div class="features-container">
            <div class="feature-card">Feature 1</div>
            <div class="feature-card">Feature 2</div>
            <div class="feature-card">Feature 3</div>
        </div>
    </section>

    <!-- 4. Chân trang (Footer) -->
    <footer class="footer">
        <p>Contact us: <a href="mailto:email@example.com">email@example.com</a></p>
    </footer>

</body>
</html>
