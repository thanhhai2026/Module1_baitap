<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            /* Màu nền gradient xanh lục bảo - xanh dương giống như ảnh mẫu */
            background: linear-gradient(135deg, #4ef2d2 0%, #3a7bd5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Khung Todo Card */
        .todo-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            font-size: 36px;
            font-weight: 700;
            color: #000;
            margin-bottom: 25px;
        }

        /* Phần nhập Todo mới */
        .input-group {
            display: flex;
            margin-bottom: 25px;
            gap: 5px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #9b5de5;
        }

        .btn-add {
            background-color: #a370f7;
            color: white;
            border: none;
            width: 50px;
            font-size: 20px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #8a4fe3;
        }

        /* Danh sách các Todo */
        .todo-list {
            list-style: none;
            margin-bottom: 25px;
            max-height: 250px;
            overflow-y: auto;
        }

        .todo-item {
            background-color: #f2f2f2;
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: #333;
            transition: all 0.2s;
            cursor: pointer;
        }

        /* Hiệu ứng hover hiển thị nút xóa giống trong ảnh mẫu */
        .todo-item:hover {
            background-color: #e2e2e2;
        }

        /* Text hiển thị công việc */
        .todo-text {
            flex: 1;
            margin-right: 10px;
            word-break: break-all;
        }

        /* Ô input dùng khi click vào để sửa (Update) */
        .edit-input {
            flex: 1;
            padding: 4px 8px;
            font-size: 16px;
            border: 1px solid #a370f7;
            border-radius: 4px;
            outline: none;
        }

        /* Nút xóa công việc */
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 15px;
            margin: -12px -15px -12px 0; /* Tràn viền phải giống ảnh mẫu */
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
            cursor: pointer;
            display: none; /* Ẩn mặc định, chỉ hiện khi hover item */
        }

        .todo-item:hover .btn-delete {
            display: block;
        }

        /* Phần chân của Card */
        .todo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: #333;
        }

        .btn-clear {
            background-color: #9b5de5;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-clear:hover {
            background-color: #7b3fd3;
        }
    </style>
</head>
<body>

    <div class="todo-card">
        <h2>Todo App</h2>
        
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Add your new todo">
            <button class="btn-add" id="btnAdd"><i class="fa-solid fa-plus"></i></button>
        </div>

        <ul class="todo-list" id="todoList">
            </ul>

        <div class="todo-footer">
            <span id="pendingCount">You have 0 pending tasks</span>
            <button class="btn-clear" id="btnClearAll">Clear All</button>
        </div>
    </div>

    <script src="./Session19 baitap4.js"></script>
</body>
</html>
