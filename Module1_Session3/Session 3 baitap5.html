<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng tỷ lệ đơn hàng theo tháng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

       
        .order-table {
            border: 1px solid #000000;
            border-collapse: separate; 
            border-spacing: 15px;     
            width: 100%;
            max-width: 750px;
        }

    
        .order-table th, .order-table td {
            border: 1px solid #000000;
            padding: 15px 10px;
            text-align: center;
            background-color: #ffffff;
        }

     
        .order-table th {
            font-family: 'Times New Roman', Times, serif;
            font-size: 22px;
            font-weight: bold;
        }

       
        .order-table td {
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <table class="order-table">
        <thead>
            <tr>
                <th style="width: 30%;">Tháng</th>
                <th colspan="2" style="width: 70%;">Tỷ lệ đơn hàng theo tháng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nguyễn Văn A</td>
                <td>15% hoàn thành</td>
                <td>85% hủy hàng</td>
            </tr>
            <tr>
                <td>Phan Văn B</td>
                <td>25% hoàn thành</td>
                <td>75% hủy hàng</td>
            </tr>
            <tr>
                <td>Nguyễn Thị C</td>
                <td>50% hoàn thành</td>
                <td>50% hủy hàng</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
