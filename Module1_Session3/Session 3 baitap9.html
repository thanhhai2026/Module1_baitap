<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập tạo Form Tìm Kiếm Sản Phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #ffffff;
            color: #000000;
        }

        .instruction {
            font-size: 16px;
            margin-bottom: 25px;
            color: #000000;
        }

        /* Tiêu đề lớn có chân (Times New Roman) */
        h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 42px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Khung bao biểu mẫu */
        .search-form {
            max-width: 600px;
        }

        /* Khối chứa từng ô nhập liệu */
        .form-group {
            margin-bottom: 25px;
        }

        /* Tiêu đề nhãn nằm phía trên ô nhập */
        .form-group label {
            display: block;
            font-family: 'Times New Roman', Times, serif;
            font-size: 26px;
            margin-bottom: 10px;
        }

        /* Ô nhập Từ khóa tìm kiếm */
        .input-field {
            width: 100%;
            max-width: 420px;
            padding: 6px;
            font-size: 16px;
            border: 1px solid #767676;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Danh sách thả xuống Chọn loại sản phẩm */
        .select-field {
            width: auto;
            min-width: 200px;
            padding: 6px;
            font-size: 20px; /* Chữ hiển thị to giống mẫu */
            font-family: Arial, sans-serif;
            border: 1px solid #767676;
            border-radius: 4px;
        }

        /* Nút Tìm kiếm */
        .search-btn {
            font-family: Arial, sans-serif;
            font-size: 22px;
            padding: 4px 20px;
            background-color: #efefef;
            border: 1px solid #767676;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .search-btn:hover {
            background-color: #e5e5e5;
        }
    </style>
</head>
<body>

    <div class="search-form">
        <h1>Tìm Kiếm Sản Phẩm</h1>

        <form action="#" method="GET">
            <div class="form-group">
                <label for="keyword">Từ khóa tìm kiếm:</label>
                <input type="text" id="keyword" class="input-field" name="keyword">
            </div>

            <div class="form-group">
                <label for="category">Loại sản phẩm:</label>
                <select id="category" class="select-field" name="category">
                    <option value="dientu">Điện tử</option>
                    <option value="giadung">Gia dụng</option>
                    <option value="thoitrang">Thời trang</option>
                </select>
            </div>

            <button type="submit" class="search-btn">Tìm kiếm</button>
        </form>
    </div>

</body>
</html>
