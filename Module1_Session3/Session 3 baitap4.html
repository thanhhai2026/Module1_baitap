<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập tạo bảng thông tin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .instruction {
            font-size: 16px;
            margin-bottom: 20px;
        }

        /* Định dạng khung viền ngoài của toàn bộ bảng */
        .info-table {
            border: 1px solid #000000;
            border-collapse: separate; /* Giữ các ô tách rời nhau */
            border-spacing: 15px;      /* Khoảng cách rỗng giữa các ô giống hình mẫu */
            width: 100%;
            max-width: 600px;
        }

        /* Định dạng viền và khoảng đệm bên trong các ô tiêu đề và ô dữ liệu */
        .info-table th, .info-table td {
            border: 1px solid #000000;
            padding: 15px 10px;
            text-align: center;
            background-color: #ffffff;
        }

        /* Định dạng kiểu chữ riêng cho hàng tiêu đề chính */
        .info-table th {
            font-family: 'Times New Roman', Times, serif;
            font-size: 24px;
            font-weight: bold;
        }

        /* Định dạng kiểu chữ cho các ô chứa dữ liệu */
        .info-table td {
            font-family: 'Times New Roman', Times, serif;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <table class="info-table">
        <thead>
            <tr>
                <th style="width: 25%;">Tên</th>
                <th style="width: 20%;">Tuổi</th>
                <th style="width: 55%;">Nghề nghiệp</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>An</td>
                <td>25</td>
                <td>Lập trình viên</td>
            </tr>
            <tr>
                <td>Bảo</td>
                <td>30</td>
                <td>Kỹ sư xây dựng</td>
            </tr>
            <tr>
                <td>Chi</td>
                <td>22</td>
                <td>Sinh viên</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
