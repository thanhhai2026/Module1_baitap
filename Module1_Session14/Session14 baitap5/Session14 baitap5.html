<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh sách sinh viên</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            color: #1e293b;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-title {
            margin-top: 0;
            font-size: 1.15rem;
            color: #2563eb;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add { background-color: #2563eb; color: white; }
        .btn-add:hover { background-color: #1d4ed8; }
        .btn-delete { background-color: #dc2626; color: white; }
        .btn-delete:hover { background-color: #b91c1c; }
        
        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
        }
        tr:hover { background-color: #f1f5f9; }
        .empty-message {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hệ Thống Quản Lý Sinh Viên</h1>

    <div class="grid">
        <div class="card">
            <h2 class="card-title">1. Thêm sinh viên mới</h2>
            <div class="input-group">
                <label for="sv_id">Mã số sinh viên (ID):</label>
                <input type="text" id="sv_id" placeholder="Ví dụ: SV001">
            </div>
            <div class="input-group">
                <label for="sv_name">Họ và tên:</label>
                <input type="text" id="sv_name" placeholder="Ví dụ: Nguyễn Văn A">
            </div>
            <div class="input-group">
                <label for="sv_age">Tuổi:</label>
                <input type="number" id="sv_age" placeholder="Ví dụ: 20" min="1">
            </div>
            <button class="btn-add" onclick="themSinhVien()">Thêm vào danh sách</button>
        </div>

        <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h2 class="card-title" style="color: #dc2626;">3. Xóa sinh viên theo ID</h2>
                <div class="input-group">
                    <label for="delete_id">Nhập ID sinh viên cần xóa:</label>
                    <input type="text" id="delete_id" placeholder="Nhập chính xác ID cần xóa...">
                </div>
            </div>
            <button class="btn-delete" onclick="xoaSinhVienTheoID()">Xóa sinh viên</button>
        </div>

        <div class="card full-width">
            <h2 class="card-title" style="color: #10b981;">2. Danh sách sinh viên hiện tại</h2>
            <div id="table_container">
                </div>
        </div>
    </div>
</div>

<script src="./Session14 baitap5.js"></script>
</body>
</html>
