<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính tổng các phần tử trong mảng</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.06);
            max-width: 600px;
            width: 100%;
            border-top: 5px solid #4f46e5;
        }
        h2 {
            color: #1e293b;
            margin-top: 0;
            font-size: 1.4rem;
            text-align: center;
        }
        p {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-align: center;
        }
        .array-item {
            background-color: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
        }
        .array-info {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            color: #1e293b;
        }
        .array-info strong {
            color: #4f46e5;
        }
        button {
            background-color: #4f46e5;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            color: #16a34a;
            font-weight: bold;
            font-family: monospace;
            font-size: 1rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Tính Tổng Phần Tử Bằng Hàm reduce()</h2>
    
    <div class="array-item">
        <div class="array-info">
            <strong>arr1</strong> = [1, 2, 3, 4, 5, 6]
        </div>
        <button onclick="chayBaiTap(1)">Tính tổng</button>
    </div>

    <div class="array-item">
        <div class="array-info">
            <strong>arr2</strong> = [10, 20, 30, 40, 50]
        </div>
        <button onclick="chayBaiTap(2)">Tính tổng</button>
    </div>

    <div class="array-item">
        <div class="array-info">
            <strong>arr3</strong> = [1, 3, 5, 7, 9]
        </div>
        <button onclick="chayBaiTap(3)">Tính tổng</button>
    </div>

    <div class="result-box" id="result_display"></div>
</div>

<script src="./Session16 baitap6.js"></script>
</body>
</html>
