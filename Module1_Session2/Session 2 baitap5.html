<body>

    <div class="form-container">
        <h1>Booking Form</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="booking-name">Name:</label>
                <input type="text" id="booking-name" name="name">
            </div>
            
            <div class="form-group">
                <label for="booking-email">Email:</label>
                <input type="email" id="booking-email" name="email">
            </div>
            
            <div class="form-group">
                <label for="booking-phone">Phone:</label>
                <input type="text" id="booking-phone" name="phone">
            </div>
            
            <div class="form-group">
                <label for="booking-date">Date:</label>
                <input type="date" id="booking-date" name="date">
            </div>
            
            <div class="form-group">
                <label for="booking-time">Time:</label>
                <input type="time" id="booking-time" name="time">
            </div>
            
            <div class="form-group">
                <label for="booking-guests">Number of Guests:</label>
                <input type="number" id="booking-guests" name="guests">
            </div>
            
            <div class="form-group">
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>

    <div class="form-container">
    
        <h1>Car Purchase Form</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="car-name">Name:</label>
                <input type="text" id="car-name" name="name">
            </div>
            
            <div class="form-group">
                <label for="car-email">Email:</label>
                <input type="email" id="car-email" name="email">
            </div>
            
            <div class="form-group">
                <label for="car-phone">Phone:</label>
                <input type="text" id="car-phone" name="phone">
            </div>
            
            <div class="form-group">
                <label for="choose-car">Choose a Car:</label>
                <select id="choose-car" name="car_model">
                    <option value="model1">Model 1</option>
                    <option value="model2">Model 2</option>
                    <option value="model3">Model 3</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="choose-color">Choose a Color:</label>
                <select id="choose-color" name="car_color">
                    <option value="red">Red</option>
                    <option value="blue">Blue</option>
                    <option value="black">Black</option>
                    <option value="white">White</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="car-quantity">Quantity:</label>
                <input type="number" id="car-quantity" name="quantity">
            </div>
            
            <div class="form-group">
                <label for="delivery-date">Delivery Date:</label>
                <input type="date" id="delivery-date" name="delivery_date">
            </div>
            
            <div class="form-group">
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>

</body>
