<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Login Form</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Sử dụng ảnh nền cây cầu trong sương mù tương tự mẫu */
            background: url('https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?q=80&w=1470&auto=format&fit=crop') no-repeat center center/cover;
        }
        .login-container {
            width: 100%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        .login-header {
            background-color: #46b8da;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .login-body {
            padding: 30px 25px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #46b8da;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #ef5350;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #e53935;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #9ca3af;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #e5e7eb;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        
        .social-login {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .social-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            text-decoration: none;
        }
        .fb { background-color: #3b5998; }
        .tw { background-color: #1da1f2; }
        .gp { background-color: #ea4335; }
        
        .footer-links {
            text-align: center;
            font-size: 0.8rem;
            color: #6b7280;
        }
        .footer-links a {
            color: #46b8da;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">LOG IN</div>
    
    <div class="login-body">
        <form onsubmit="xuLyDangNhap(event)">
            <div class="input-group">
                <input type="text" id="username" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-submit">Submit</button>
        </form>

        <div class="divider">OR</div>

        <div class="social-login">
            <a href="#" class="social-icon fb">f</a>
            <a href="#" class="social-icon tw">t</a>
            <a href="#" class="social-icon gp">G+</a>
        </div>

        <div class="footer-links">
            No account yet? <a href="#">Signup</a><br>
            <a href="#" style="display: inline-block; margin-top: 8px;">Forgot your password?</a>
        </div>
    </div>
</div>

<script src="./Session17 baitap5.js"></script>
</body>
</html>
