<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính cá nhân - Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .calculator {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 320px;
            border: 1px solid #e2e8f0;
        }
        /* Màn hình hiển thị kết quả */
        .display {
            width: 100%;
            height: 60px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: right;
            padding: 10px 15px;
            box-sizing: border-box;
            color: #1e293b;
            font-family: monospace;
            overflow: hidden;
        }
        /* Bố cục lưới cho các nút bấm */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 50px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            background-color: #f1f5f9;
            color: #334155;
        }
        button:hover {
            background-color: #e2e8f0;
        }
        /* Nút toán tử (+, -, *, /) */
        button.operator {
            background-color: #e0f2fe;
            color: #0284c7;
        }
        button.operator:hover {
            background-color: #bae6fd;
        }
        /* Nút chức năng xóa (C) */
        button.clear {
            background-color: #fee2e2;
            color: #ef4444;
        }
        button.clear:hover {
            background-color: #fca5a5;
        }
        /* Nút bằng (=) */
        button.equal {
            background-color: #10b981;
            color: white;
            grid-column: span 2; /* Chiếm 2 cột cho cân đối giống máy tính thật */
        }
        button.equal:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display" id="calc_display">0</div>
    
    <div class="buttons-grid">
        <button class="clear" onclick="xoaTatCa()">C</button>
        <button class="operator" onclick="nhapToanTu('/')">/</button>
        <button class="operator" onclick="nhapToanTu('*')">x</button>
        <button class="operator" onclick="nhapToanTu('-')">-</button>
        
        <button onclick="nhapSo('7')">7</button>
        <button onclick="nhapSo('8')">8</button>
        <button onclick="nhapSo('9')">9</button>
        <button class="operator" style="grid-row: span 2; height: 110px;" onclick="nhapToanTu('+')">+</button>
        
        <button onclick="nhapSo('4')">4</button>
        <button onclick="nhapSo('5')">5</button>
        <button onclick="nhapSo('6')">6</button>
        
        <button onclick="nhapSo('1')">1</button>
        <button onclick="nhapSo('2')">2</button>
        <button onclick="nhapSo('3')">3</button>
        <button class="equal" onclick="tinhKetQua()">=</button>
        
        <button style="grid-column: span 2;" onclick="nhapSo('0')">0</button>
        <button onclick="nhapSo('.')">.</button>
    </div>
</div>

<script src="./Session17 baitap6.js"></script>
</body>
</html>
